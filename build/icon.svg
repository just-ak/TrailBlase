<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>TrailRT</title>
  <desc>A winding trail with a waypoint marker. Source for build/icon.icns — regenerate with scripts/generate-icon.sh</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- macOS icons sit inside a rounded square with margin rather than
       bleeding to the edge. 88px inset, 200px corner radius. -->
  <rect x="88" y="88" width="848" height="848" rx="200" fill="url(#bg)"/>

  <!-- Faint contour lines, suggesting terrain without adding clutter at 16px. -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="14" stroke-linecap="round">
    <path d="M150 700 C 300 640, 360 760, 520 700 S 760 600, 880 660"/>
    <path d="M150 790 C 320 740, 400 840, 560 790 S 780 710, 880 760"/>
  </g>

  <!-- The trail: a single confident stroke, legible when very small. -->
  <path
    d="M268 788 C 268 660, 420 668, 436 560 C 452 452, 332 420, 372 322 C 404 244, 560 252, 612 300"
    fill="none"
    stroke="url(#trail)"
    stroke-width="68"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Start point. -->
  <circle cx="268" cy="788" r="52" fill="#0b1220"/>
  <circle cx="268" cy="788" r="34" fill="#34d399"/>

  <!-- Destination waypoint pin. -->
  <g transform="translate(656 236)">
    <path
      d="M0 -150 C 82 -150, 148 -86, 148 -6 C 148 92, 36 182, 0 236 C -36 182, -148 92, -148 -6 C -148 -86, -82 -150, 0 -150 Z"
      fill="#f8fafc"
    />
    <circle cx="0" cy="-10" r="58" fill="#1e293b"/>
  </g>
</svg>
