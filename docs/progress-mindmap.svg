    <circle cx="1440" cy="54" r="5" fill="#8b5cf6"/><text x="1454" y="59">Investigation (3)</text>
    <circle cx="1604" cy="54" r="5" fill="#dc2626"/><text x="1618" y="59">Blocked (0)</text>
  </g>
  <line x1="48" y1="114" x2="1792" y2="114" stroke="#e2e8f0" stroke-width="1.5"/>

