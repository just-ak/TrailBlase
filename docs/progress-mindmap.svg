<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1360" viewBox="0 0 1840 1360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>TrailRT implementation progress</title>
  <desc>Mindmap tracking implementation status across five phases. Leaf nodes carry data-status attributes: done, in-progress, todo, investigation, blocked.</desc>

  <style>
    .leaf      { font-size: 15px; fill: #334155; }
    .lr        { text-anchor: start; }
    .ll        { text-anchor: end; }
    .phase     { font-size: 16px; font-weight: 600; text-anchor: middle; }
    .count     { font-size: 12px; fill: #64748b; text-anchor: middle; }
    .link      { fill: none; stroke-width: 2.5; stroke-opacity: 0.45; }
    .legend    { font-size: 13px; fill: #475569; }
    .hdr       { font-size: 26px; font-weight: 700; fill: #0f172a; }
    .sub       { font-size: 14px; fill: #64748b; }
    .pct       { font-size: 13px; font-weight: 600; fill: #475569; }
  </style>

  <rect width="1840" height="1360" fill="#f8fafc"/>

  <!-- ============ header band ============ -->
  <text class="hdr" x="48" y="46">TrailRT — Implementation Progress</text>
  <text class="sub" x="48" y="72">Garmin BaseCamp replacement · macOS · Electron + React · GPL-3.0 · 5 phases · 53 tracked tasks</text>

  <rect x="48" y="86" width="420" height="9" rx="4.5" fill="#e2e8f0"/>
  <rect x="48" y="86" width="214" height="9" rx="4.5" fill="#16a34a"/>
  <text class="pct" x="482" y="95">27 / 53 verified complete (51%) — Phase 1 done, Phase 2 next</text>

